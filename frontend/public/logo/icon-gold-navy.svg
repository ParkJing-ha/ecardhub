<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4C542"/>
      <stop offset="100%" stop-color="#C9971F"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FBF6E8"/>
    </linearGradient>
    <linearGradient id="flap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F1F4D"/>
    </linearGradient>
  </defs>

  <!-- background with rounded corners (squircle-ish) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="98" fill="none" stroke="#0F1F4D" stroke-width="18"/>

  <!-- subtle glow -->
  <circle cx="256" cy="200" r="220" fill="#FFFFFF" opacity="0.06"/>

  <!-- envelope/card body -->
  <g>
    <rect x="96" y="150" width="320" height="230" rx="24" fill="url(#card)" stroke="#0F1F4D" stroke-width="5"/>

    <!-- envelope flap -->
    <path d="M96 174 L256 300 L416 174 L416 174 C416 160.745 405.255 150 392 150 L120 150 C106.745 150 96 160.745 96 174 Z" fill="url(#flap)" stroke="#0F1F4D" stroke-width="5" stroke-linejoin="round"/>

    <!-- flap fold lines -->
    <path d="M96 174 L256 300 L416 174" fill="none" stroke="#0F1F4D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- QR code accent, bottom-right corner, representing check-in -->
  <g transform="translate(300,272)">
    <rect x="0" y="0" width="92" height="92" rx="14" fill="#FFFFFF" stroke="#0F1F4D" stroke-width="3"/>
    <!-- QR-style dot grid -->
    <g fill="#0F1F4D">
      <rect x="10" y="10" width="20" height="20" rx="3"/>
      <rect x="62" y="10" width="20" height="20" rx="3"/>
      <rect x="10" y="62" width="20" height="20" rx="3"/>
      <rect x="16" y="16" width="8" height="8" rx="1" fill="#FFFFFF"/>
      <rect x="68" y="16" width="8" height="8" rx="1" fill="#FFFFFF"/>
      <rect x="16" y="68" width="8" height="8" rx="1" fill="#FFFFFF"/>
      <rect x="40" y="10" width="8" height="8" rx="1"/>
      <rect x="40" y="26" width="8" height="8" rx="1"/>
      <rect x="52" y="40" width="8" height="8" rx="1"/>
      <rect x="40" y="40" width="8" height="8" rx="1"/>
      <rect x="10" y="40" width="8" height="8" rx="1"/>
      <rect x="62" y="40" width="8" height="8" rx="1"/>
      <rect x="40" y="52" width="8" height="8" rx="1"/>
      <rect x="62" y="62" width="8" height="8" rx="1"/>
      <rect x="76" y="62" width="8" height="8" rx="1"/>
      <rect x="62" y="76" width="8" height="8" rx="1"/>
      <rect x="76" y="76" width="8" height="8" rx="1"/>
      <rect x="40" y="76" width="8" height="8" rx="1"/>
    </g>
  </g>
</svg>
